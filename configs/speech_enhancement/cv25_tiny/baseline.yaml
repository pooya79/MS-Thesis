# Pilot budget: profile throughput and freeze the final recipe before comparisons.
model:
  name: openai/whisper-tiny
  pretrained_model: null
  language: Persian
  task: transcribe
data:
  root_dir: data/cv25-official
  datasets:
  - cv-corpus-25.0
  - cv-corpus-25.0-degraded-v2
  sample_rate: 16000
run:
  output_dir: models/asr/cv25-tiny-official
  name: baseline
  resume: auto
training:
  seed: 1337
  num_train_epochs: 1
  learning_rate: 1.0e-05
  warmup_steps: 0
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  eval_steps: 500
  save_steps: 500
  logging_steps: 25
  save_total_limit: 3
  num_workers: 2
  device: auto
  mixed_precision: auto
  load_best_model_at_end: true
  generation_max_length: 225
