server:
  base_url: http://127.0.0.1:8000
  model: Qwen/Qwen3-8B
  timeout_seconds: 120
  retry_count: 2
  # Set to an environment-variable name, never an API key value.
  api_key_env: null

context:
  size: 3

batch:
  size: 16

generation:
  temperature: 0
  top_p: 1
  n: 1
  seed: 0
  max_tokens: 256

validation:
  maximum_normalized_edit_distance: 0.35
