[project]
name = "ms-thesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clearvoice==0.1.2",
    "datasets>=4.8.5",
    "fastapi>=0.129.0",
    "huggingface-hub>=1.16.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jiwer>=4.0.0",
    "jupyter>=1.1.1",
    "librosa>=0.11.0",
    "mutagen>=1.47.0",
    "numpy>=2.4.6",
    "onnxruntime==1.30.0",
    "pytest>=9.0.2",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.1",
    "silero-vad>=6.2.1,<7",
    "soundfile>=0.13.1",
    "soxr>=1.1.0",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
    "transformers[torch]>=5.9.0",
    "uvicorn>=0.41.0",
    "yamlargparse==1.31.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# Only ClearVoice's FRCRN model is imported. Its published dependency set is for
# the full multi-task application and hard-pins NumPy/librosa/soundfile versions
# that conflict with this project. Keep the package itself in the uv lock while
# relying on the project's direct numerical/audio dependencies.
exclude-dependencies = [
    { package = { name = "clearvoice", version = "0.1.2" }, dependencies = [
        "einops",
        "gdown",
        "huggingface-hub",
        "joblib",
        "librosa",
        "numpy",
        "opencv-python",
        "packaging",
        "pydub",
        "python-speech-features",
        "rotary-embedding-torch",
        "scenedetect",
        "scikit-learn",
        "scipy",
        "soundfile",
        "torch",
        "torchaudio",
        "torchinfo",
        "torchvision",
        "tqdm",
        "yamlargparse",
    ] },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
