model:
  name: openai/whisper-small
  pretrained_model: null
  language: Persian
  task: transcribe
data:
  root_dir: data
  datasets:
  - path: cv-corpus-25.0-noise-added
    kind: paired
  - path: cv-corpus-25.0-noise-added-long
    kind: paired
  - path: cv-corpus-25.0
    kind: clean
  - path: FarsSpon_train_dev
    kind: clean
  - path: cv-corpus-25.0-long
    kind: clean
  - path: FarsSpon_train_dev-long
    kind: clean
  - path: fleurs-normalized
    kind: clean
  sample_rate: 16000
  mapping_filename: degraded_to_clean.jsonl
run:
  output_dir: models/asr/pmct-whisper-small/runs
  name: pmct-whisper-small-fa
  resume: auto
training:
  seed: 1337
  num_train_epochs: 1
  learning_rate: 1.0e-05
  warmup_steps: 0
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  eval_steps: 60000
  save_steps: 1000
  logging_steps: 25
  save_total_limit: 3
  num_workers: 4
  device: auto
  mixed_precision: auto
  load_best_model_at_end: false
  generation_max_length: 225
pmct:
  patch_seconds: 1.0
  clean_probability: 0.5
