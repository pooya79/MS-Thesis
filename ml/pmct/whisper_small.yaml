model:
  name: openai/whisper-small
  pretrained_model:
  language: Persian
  task: transcribe

data:
  root_dir: data
  datasets:
    # Paired datasets must contain degraded_to_clean.jsonl.
    - path: cv-corpus-25.0-noise-added
      kind: paired
    # Plain ASR datasets can be mixed into the same run unchanged.
    # - path: FarsSpon_train_dev
    #   kind: clean
  sample_rate: 16000
  mapping_filename: degraded_to_clean.jsonl

pmct:
  # Paper ablations found pi=0.5 and a 1.0-1.5 second patch most effective.
  patch_seconds: 1.0
  clean_probability: 0.5

run:
  output_dir: models/asr/pmct-whisper-small/runs
  name: pmct-whisper-small-fa
  resume: auto

training:
  seed: 1337
  num_train_epochs: 3
  learning_rate: 0.00001
  warmup_steps: 500
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  eval_steps: 500
  save_steps: 500
  logging_steps: 25
  save_total_limit: 3
  num_workers: 2
  device: auto
  mixed_precision: auto
  load_best_model_at_end: false
  generation_max_length: 225
